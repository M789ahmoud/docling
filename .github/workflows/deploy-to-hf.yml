name: Deploy to Hugging Face Spaces

  on:
    push:
      branches: [main]
      paths:
        - "hf-space/**"
    workflow_dispatch:

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Create HF Space (if it does not exist)
          env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
            HF_USERNAME: ${{ secrets.HF_USERNAME }}
          run: |
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              "https://huggingface.co/api/spaces/${HF_USERNAME}/docling-api")
            if [ "$STATUS" = "404" ]; then
              echo "Creating Space ${HF_USERNAME}/docling-api..."
              curl -s -X POST "https://huggingface.co/api/repos/create" \
                -H "Authorization: Bearer ${HF_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"space\",\"name\":\"docling-api\",\"sdk\":\"docker\",\"private\":false}"
            else
              echo "Space exists (HTTP $STATUS)"
            fi

        - name: Push files to HF Space
          env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
            HF_USERNAME: ${{ secrets.HF_USERNAME }}
          run: |
            git config --global user.email "actions@github.com"
            git config --global user.name "GitHub Actions"

            git clone "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/docling-api" hf-deploy

            cp hf-space/app.py        hf-deploy/app.py
            cp hf-space/Dockerfile    hf-deploy/Dockerfile
            cp hf-space/requirements.txt hf-deploy/requirements.txt
            cp hf-space/README.md     hf-deploy/README.md

            cd hf-deploy
            git add -A
            git diff --cached --quiet && echo "No changes" && exit 0
            git commit -m "Deploy from GitHub [${GITHUB_SHA::8}]"
            git push
            echo "Deployed! https://huggingface.co/spaces/${HF_USERNAME}/docling-api"
  